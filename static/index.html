<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digit Recognizer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; }
        #canvas { border: 2px solid #000; background-color: #000; cursor: crosshair; }
        .controls { margin-top: 15px; }
        button { padding: 8px 16px; font-size: 16px; margin: 0 5px; cursor: pointer; }
        #result { margin-top: 20px; font-size: 22px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Draw a Digit (0-9)</h2>
    <canvas id="canvas" width="280" height="280"></canvas>
    
    <div class="controls">
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="predict()">Predict</button>
    </div>

    <div id="result">Draw something and click Predict</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // Canvas setup for white drawing on black background
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 18;
        ctx.lineCap = "round";

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => { isDrawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearCanvas() {
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            document.getElementById('result').innerText = "Draw something and click Predict";
        }

        async function predict() {
            const dataURL = canvas.toDataURL('image/png');
            
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image_data: dataURL })
            });

            const result = await response.json();
            if (response.ok) {
                document.getElementById('result').innerText = 
                    `Prediction: ${result.prediction} (${result.confidence}% confidence)`;
            } else {
                document.getElementById('result').innerText = "Error predicting image.";
            }
        }
    </script>
</body>
</html>
